[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crystalprobe"
version = "0.1.0"
description = "Interpretability-first tools for trustworthy polymorph-pair benchmarking and MLIP uncertainty."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
  {name = "CrystalProbe contributors"}
]
dependencies = [
  "pydantic>=2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]
conformer = [
  "numpy<2",
  "rdkit-pypi==2022.9.5"
]

[project.scripts]
crystalprobe = "crystalprobe.benchmark.cli:main"

[project.urls]
Repository = "https://github.com/aleg448/Polyfolding"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
