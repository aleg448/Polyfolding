name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q

  scientific-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install conformer and structure test dependencies
        run: python -m pip install -e ".[dev,conformer]" "ase>=3.23"
      - name: Test scientific contracts and campaign recovery
        run: python -m pytest tests/test_scope.py tests/test_conformer_generation.py tests/test_local_geometry.py tests/test_optional_adapters.py tests/test_molecule_bug_hunt.py tests/test_research_campaign.py tests/test_cposs_promotion.py tests/test_cposs_runner.py -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lint tools
        run: python -m pip install -e ".[lint]"
      - name: Ruff
        run: python -m ruff check src scripts tests
      - name: Mypy (typed core)
        run: python -m mypy

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
